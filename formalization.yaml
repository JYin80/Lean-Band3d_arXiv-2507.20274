# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4, for Palomar (https://palomar-registry.org/).
version: "v0.4"

project:
  name: "Delocalization of non-mean-field random matrices in dimensions d >= 3"
  description: >-
    A Lean 4 / Mathlib proof of the main results of Dubova, Yang, Yau and Yin, "Delocalization of
    non-mean-field random matrices in dimensions d >= 3" (arXiv:2507.20274). The model is the
    Gaussian block band matrix on the torus Z_{WL}^d with L^d blocks of size W^d, N = (WL)^d, with
    the variance profile (2.5) under the size conditions (2.9), (2.10). For every dimension
    d >= 3, this entry contains Theorem 2.1 (delocalization of the bulk eigenvectors), Theorem 2.2
    (the local law, (2.14)-(2.15)), Theorem 2.3 (quantum unique ergodicity, (2.18)-(2.19)) and
    Theorem 2.5 (quantum diffusion, (2.22)-(2.25)); they have no hypotheses other than their
    parameters, and no result of another work is assumed for them. The library also proves
    Theorem 2.4 (bulk universality) and Theorem 2.7 (the block Anderson model) from one external
    input, stated as an explicit hypothesis; those two are not part of this entry.
  authors:
    - "Jun Yin"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jun Yin"

classification:
  arxiv: ["math.PR", "math-ph"]
  msc2020: ["60B20", "15B52", "82B44"]

sources:
  - title: "Delocalization of non-mean-field random matrices in dimensions d >= 3"
    authors:
      - "Sofiia Dubova"
      - "Fan Yang"
      - "Horng-Tzer Yau"
      - "Jun Yin"
    id: "arXiv:2507.20274"
    type: "paper"
    location: "https://arxiv.org/abs/2507.20274"
    relationship: "formalizes"
    note: >-
      The Lean code follows paper/DubovaYangYauYin_RBM3D_Lean_version.pdf in this repository;
      page, equation and theorem numbers in docs/PAPER-VS-LEAN.md refer to it. Jun Yin, a
      co-author of the paper, is the author of the formalization.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    In this entry (Challenge.lean): Theorems 2.1, 2.2, 2.3 and 2.5, for every d >= 3. Also proved
    in the library, not in this entry: Theorem 2.4 (bulk universality, (2.20)) and Theorem 2.7
    (the block Anderson model), which take the fixed-energy universality of Dyson Brownian motion
    (Landon-Sosoe-Yau) as the explicit hypothesis RBM.Univ.UNL32
    (RBM.Endpoints.final_shape in RBM3D/Main/FinalShape.lean; docs/PAPER-VS-LEAN.md).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5", "claude-sonnet-5-5", "claude-fable-5-1", "claude-fable-5-2"]
      framework: "Claude Code"
      tool_setup: >-
        AI-assisted: a team of Claude Code agents (a dispatcher, workers on ticket worktrees and
        reviewing agents) wrote the Lean code and the comparison documents from the paper's
        source, under the direction of Jun Yin, who fixed the endpoint statements. The upgrade to
        Lean v4.36, the port to the Lean module system and the Challenge/Solution files for
        Palomar were also written with Claude.
      cost:
        wall_time: "about 267 hours of active work between 2026-09-19 and 2026-10-18 (1311 commits in the work repository; the run was paused for long stretches in between)"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    The mathematical source is a paper by Sofiia Dubova, Fan Yang, Horng-Tzer Yau and Jun Yin.
    The Lean proofs were produced by AI agents; the statements of the main theorems and of the
    definitions they use were fixed and checked by Jun Yin against the paper.

fidelity:
  divergences: >-
    (1) The statements are made along any admissible sequence of sizes, which is the paper's
    "for N sufficiently large". (2) Probability bounds are stated for the failure events.
    (3) One probability space serves all n. (4) Some proofs take a different route from the
    paper. Details: docs/PAPER-VS-LEAN.md.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    The Lean proof of each ticket was audited by a separate auditing agent, and a supervising
    agent checked the final statements. Jun Yin checked the statements of the main theorems and
    of the definitions they use against the paper. No independent human review has been
    performed.

alignment:
  namespace: "RBM.Endpoints"
  statements:
    - source: "Theorem 2.1"
      lean: "RBM.Endpoints.theorem_2_1"
      module: "Challenge"
      status: "proved"
      note: "The statement is RBM.Endpoints.decol; proved in Solution.lean by RBM.Endpoints.decol_holds."
    - source: "Theorem 2.2, (2.14)-(2.15)"
      lean: "RBM.Endpoints.theorem_2_2"
      module: "Challenge"
      status: "proved"
      note: "The statement is RBM.Endpoints.locSC; proved by RBM.Endpoints.locSC_holds."
    - source: "Theorem 2.3, (2.18)-(2.19)"
      lean: "RBM.Endpoints.theorem_2_3"
      module: "Challenge"
      status: "proved"
      note: "The statement is RBM.Endpoints.QUE; proved by RBM.Endpoints.QUE_holds."
    - source: "Theorem 2.5, (2.22)-(2.25)"
      lean: "RBM.Endpoints.theorem_2_5"
      module: "Challenge"
      status: "proved"
      note: "The statement is RBM.Endpoints.QDiff; proved by RBM.Endpoints.QDiff_holds."

acknowledgements: "Mathlib and the Lean community; Lean 4 (Lean FRO); Claude Code (Anthropic)."
